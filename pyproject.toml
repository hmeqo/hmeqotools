[project]
name = "hmeqotools"
version = "0.1.3"
description = "A simple toolkit for Python."
readme = "README.md"
requires-python = ">=3.8"
authors = []
dependencies = ["httpx"]

[project.optional-dependencies]
mathutil = ["rich"]
crypto = ["cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmeqotools"]
